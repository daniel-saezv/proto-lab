name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, tests y build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar imagen Docker de Playwright (lockfile)
        run: bash .github/scripts/assert-playwright-docker-image.sh
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  main-push:
    name: Typecheck y unitarios (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar imagen Docker de Playwright (lockfile)
        run: bash .github/scripts/assert-playwright-docker-image.sh
      - run: pnpm typecheck
      - run: pnpm test:unit

  # La imagen de los e2e está fijada abajo (v1.64.1-noble). Este job ya no
  # etiqueta el contenedor; se conserva hasta confirmar si el check es obligatorio.
  playwright-version:
    name: Versión Playwright (lockfile)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolver versión de Playwright
        id: playwright-version
        run: |
          version=$(bash .github/scripts/playwright-lockfile-version.sh)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # Chromium en runners de 2 vCPU va a 1 worker (SwiftShader). Tres shards bajan
  # el reloj de pared. El grupo en serie de private-assets no se parte y puede
  # compartir máquina con otros tests del mismo shard.
  # Imagen fijada: al subir @playwright/test, actualiza este tag (la acción
  # de e2e exige que el CLI del contenedor coincida con el lockfile).
  e2e-chromium:
    name: E2E (chromium ${{ matrix.shard }}/3)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/playwright
        with:
          browser: chromium
          project: chromium
          shard: ${{ matrix.shard }}/3

  # Mantiene el nombre del check obligatorio. Queda pendiente hasta que
  # terminan los shards; la duración que muestra GitHub es solo esta compuerta.
  e2e-chromium-gate:
    name: E2E (chromium)
    needs: e2e-chromium
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.e2e-chromium.result != 'cancelled' &&
      needs.e2e-chromium.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de los shards
        run: |
          echo "shards=${{ needs.e2e-chromium.result }}"
          test "${{ needs.e2e-chromium.result }}" = "success"

  e2e-webkit:
    name: E2E (webkit-iphone)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/playwright
        with:
          browser: webkit
          project: webkit-iphone
