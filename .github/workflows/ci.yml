name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, tests y build
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      lab: ${{ steps.clasificar.outputs.lab }}
      protos: ${{ steps.clasificar.outputs.protos }}
      mode: ${{ steps.clasificar.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Clasificar diff
        id: clasificar
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-paths.mjs
      - run: pnpm install --frozen-lockfile
      - name: Comprobar imagen Docker de Playwright (lockfile)
        if: steps.clasificar.outputs.mode == 'completo'
        run: bash .github/scripts/assert-playwright-docker-image.sh
      - name: Typecheck, tests y build
        if: steps.clasificar.outputs.mode == 'completo'
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm build
      - name: Typecheck, tests y build de las aplicaciones
        if: steps.clasificar.outputs.mode == 'aplicaciones'
        env:
          PROTOS: ${{ steps.clasificar.outputs.protos }}
        run: bash .github/scripts/ci-protos.sh
      - name: Guardar el sitio para el e2e táctil
        if: steps.clasificar.outputs.lab == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  main-push:
    name: Typecheck y unitarios (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar imagen Docker de Playwright (lockfile)
        run: bash .github/scripts/assert-playwright-docker-image.sh
      - run: pnpm typecheck
      - run: pnpm test:unit

  # Chromium en runners de 2 vCPU va a 1 worker (SwiftShader). Tres shards bajan
  # el reloj de pared. El grupo en serie de private-assets no se parte y puede
  # compartir máquina con otros tests del mismo shard.
  # Imagen fijada: al subir @playwright/test, actualiza este tag (la acción
  # de e2e exige que el CLI del contenedor coincida con el lockfile).
  # Espera a verificar: la clasificación sale de ese job y no hace falta
  # otro minuto solo para leer el diff. Si el diff no toca el laboratorio,
  # este job se omite y la compuerta E2E (chromium) informa éxito.
  e2e-chromium:
    name: E2E (chromium ${{ matrix.shard }}/3)
    needs: verificar
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.verificar.result != 'cancelled' &&
      needs.verificar.outputs.lab == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/playwright
        with:
          browser: chromium
          project: chromium
          shard: ${{ matrix.shard }}/3

  # Mantiene el nombre del check obligatorio. Siempre informa: si no hay que
  # correr e2e, termina en verde; si los shards fallan, falla.
  e2e-chromium-gate:
    name: E2E (chromium)
    needs: [verificar, e2e-chromium]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.verificar.result != 'cancelled' &&
      needs.e2e-chromium.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de los shards
        run: |
          set -euo pipefail
          lab="${{ needs.verificar.outputs.lab }}"
          shards="${{ needs.e2e-chromium.result }}"
          echo "verificar=${{ needs.verificar.result }} lab=${lab} shards=${shards}"
          if [ -z "${lab}" ]; then
            echo "No se pudo clasificar el diff."
            exit 1
          fi
          if [ "${lab}" != "true" ]; then
            echo "E2E omitido: el diff no toca el laboratorio, functions, e2e, scripts, workflows ni la configuración de la raíz."
            exit 0
          fi
          test "${shards}" = "success"

  e2e-webkit:
    name: E2E (webkit-iphone trabajo)
    needs: verificar
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.verificar.result != 'cancelled' &&
      needs.verificar.outputs.lab == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/playwright
        with:
          browser: webkit
          project: webkit-iphone

  e2e-webkit-gate:
    name: E2E (webkit-iphone)
    needs: [verificar, e2e-webkit]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.verificar.result != 'cancelled' &&
      needs.e2e-webkit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de WebKit
        run: |
          set -euo pipefail
          lab="${{ needs.verificar.outputs.lab }}"
          webkit="${{ needs.e2e-webkit.result }}"
          echo "verificar=${{ needs.verificar.result }} lab=${lab} webkit=${webkit}"
          if [ -z "${lab}" ]; then
            echo "No se pudo clasificar el diff."
            exit 1
          fi
          if [ "${lab}" != "true" ]; then
            echo "E2E omitido: el diff no toca el laboratorio, functions, e2e, scripts, workflows ni la configuración de la raíz."
            exit 0
          fi
          test "${webkit}" = "success"

  # Un solo job, sin shard y sin compuerta: no es check obligatorio.
  # Reutiliza el dist de verificar y solo corre los tests marcados @movil.
  e2e-chromium-android:
    name: E2E (chromium-android)
    needs: verificar
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.verificar.result == 'success' &&
      needs.verificar.outputs.lab == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Recuperar el sitio ya construido
        uses: actions/download-artifact@v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Asegurar dist/index.html
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/index.html ]; then
            exit 0
          fi
          if [ -f dist/dist/index.html ]; then
            mkdir -p dist-site
            mv dist/dist/* dist-site/
            rm -rf dist
            mv dist-site dist
            exit 0
          fi
          echo "No está dist/index.html" >&2
          find dist -maxdepth 3 -type f | head
          exit 1
      - uses: ./.github/actions/playwright
        with:
          browser: chromium
          project: chromium-android
          build: "false"
