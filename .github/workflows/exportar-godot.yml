# Export web de Godot 4.7.2 en un solo hilo y Brotli q11.
# No publica el sitio, no usa secretos y no habla con R2.
# Solo corre en un pull request si el diff toca un proyecto Godot, o a mano.
# No hay push a main ni schedule: al fusionar no se vuelve a exportar.
name: Exportar Godot web

on:
  pull_request:
    paths:
      - "protos/**/godot/**"
      - "templates/export-estatico/godot-shell.html"
      - "templates/export-estatico/arranque.js"
      - "scripts/godot-web.mjs"
      - "scripts/wasm-module.mjs"
      - ".github/workflows/exportar-godot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: exportar-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exportar:
    name: Export de un hilo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Librerías del editor
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libfontconfig1

      - name: Carpeta del preset
        run: mkdir -p protos/toque/godot/build

      - name: Exportar Toque
        uses: firebelley/godot-export@615a6f7afc22d6266bf55c17748fb07447e8bdab
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./protos/toque/godot
          relative_export_path: ./protos/toque/godot/salida
          cache: true
          verbose: true
          presets_to_export: Web

      - name: Comprobar el wasm publicado
        run: node scripts/godot-web.mjs --check protos/toque --export protos/toque/godot/salida
