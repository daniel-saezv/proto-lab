name: Migraciones D1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: d1-tablas-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar migraciones D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Aplicar migraciones del lab y de las apps
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1-app-tables.mjs
