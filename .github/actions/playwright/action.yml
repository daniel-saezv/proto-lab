name: Playwright en CI
description: Build, install con pnpm y tests Playwright en el contenedor oficial (sin caché ~/.cache/ms-playwright ni install-deps).

inputs:
  browser:
    description: chromium o webkit
    required: true
  project:
    description: Nombre del proyecto de Playwright
    required: true
  shard:
    description: Shard current/total. Vacío para ejecutar el proyecto entero.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configurar git (contenedor)
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 12.17.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 22
        cache: pnpm
    - name: Comprobar ruta de navegadores (imagen)
      shell: bash
      run: |
        if [[ -z "${PLAYWRIGHT_BROWSERS_PATH:-}" ]]; then
          echo "PLAYWRIGHT_BROWSERS_PATH vacío; se esperaba la ruta de la imagen oficial (/ms-playwright)." >&2
          exit 1
        fi
        echo "Navegadores preinstalados en ${PLAYWRIGHT_BROWSERS_PATH}"
    - name: Instalar dependencias
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      run: pnpm install --frozen-lockfile
    - name: Comprobar alineación con la imagen Docker
      shell: bash
      run: |
        expected=$(bash .github/scripts/playwright-lockfile-version.sh)
        actual=$(pnpm exec playwright --version | sed -n 's/^Version //p')
        if [[ "$expected" != "$actual" ]]; then
          echo "Lockfile: $expected; CLI en contenedor: $actual" >&2
          exit 1
        fi
        echo "Playwright $actual alineado con lockfile"
    - name: Build
      shell: bash
      run: pnpm build
    - name: Tests
      shell: bash
      run: |
        case "${{ inputs.browser }}" in
          chromium|webkit) ;;
          *) echo "navegador no soportado" >&2; exit 1 ;;
        esac
        shard="${{ inputs.shard }}"
        if [ -n "$shard" ]; then
          pnpm exec playwright test --project="${{ inputs.project }}" --shard="$shard"
        else
          pnpm exec playwright test --project="${{ inputs.project }}"
        fi
