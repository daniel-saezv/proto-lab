<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14182b" />
    <meta name="description" content="Laboratorio privado de prototipos" />
    <meta name="robots" content="noindex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Proto Lab" />
    <title>Proto Lab</title>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #14182b; color: #f6f1e7; font-family: "Segoe UI", sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
      .boot-spark { width: 18px; height: 18px; margin: 0 auto 16px; border-radius: 50%; background: #ffb703; box-shadow: 0 0 24px #ffb703; }
    </style>
  </head>
  <body>
    <div id="boot" data-testid="loading">
      <div>
        <div class="boot-spark"></div>
        <p>Encendiendo el laboratorio…</p>
      </div>
    </div>
    <div id="shell" hidden>
      <p class="sr-only">Laboratorio en tres dimensiones. En una pantalla táctil, toca a la izquierda para caminar y a la derecha para mirar. Con teclado, WASD para caminar y el ratón para mirar. Pulsa E o el botón para usar lo que tengas delante.</p>
      <div id="viewport"></div>
      <div id="labels"></div>
      <p id="hint" data-testid="hint"></p>
      <div id="presence-alias-bar" class="presence-alias-bar" data-testid="presence-alias-bar">
        <label class="presence-alias-bar__label" for="presence-alias">Alias en la sala</label>
        <input
          id="presence-alias"
          class="presence-alias-bar__input"
          type="text"
          maxlength="32"
          autocomplete="nickname"
          data-testid="presence-alias-input"
          placeholder="Opcional"
          aria-describedby="presence-alias-hint"
        />
        <p id="presence-alias-hint" class="presence-alias-bar__hint">Solo en este navegador. No uses tu correo.</p>
      </div>
      <button id="mute-music" type="button" data-testid="mute-music" aria-pressed="false" aria-label="Silenciar música">
        <svg class="mute-icon mute-icon--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4z" />
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M15.5 9.2a3.8 3.8 0 0 1 0 5.6M17.8 7a6.6 6.6 0 0 1 0 10" />
        </svg>
        <svg class="mute-icon mute-icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4z" />
          <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16 10.2 20 14.2M20 10.2l-4 4" />
        </svg>
      </button>
      <button id="board-back" type="button" class="dialog-dismiss dialog-dismiss--screen" data-testid="board-back" hidden aria-label="Cerrar">×</button>
      <button id="workshop-skip" type="button" data-testid="workshop-skip" hidden>Saltar</button>
      <div id="board-a11y" class="sr-only" data-testid="board-a11y" role="region" aria-label="Tablón de propuestas" hidden></div>
      <button id="interact" type="button" data-testid="interact" hidden></button>
      <div id="touch-controls" data-testid="touch-controls" hidden>
        <div id="touch-zone-move" class="touch-zone touch-zone--move"></div>
        <div id="touch-zone-look" class="touch-zone touch-zone--look"></div>
        <div id="joystick" data-testid="joystick" hidden></div>
      </div>
      <div id="dialogue" data-testid="dialogue" hidden role="dialog" aria-modal="true" aria-labelledby="dialogue-name"></div>
      <div id="game-selector" hidden></div>
      <div id="install-help" hidden></div>
      <div id="stage" data-testid="prototype-player" hidden></div>
      <div id="fallback" data-testid="fallback" hidden></div>
    </div>
    <noscript><p>Proto Lab necesita JavaScript para encender el laboratorio.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
