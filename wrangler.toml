# Pages Functions. El despliegue lo hace la integración Git de Cloudflare Pages,
# no GitHub Actions. El comando de build y el directorio de salida se configuran
# en el panel y deben coincidir con este archivo.
name = "proto-lab-3k6"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-30"

# Bindings (KV, etc.) van en este archivo; los secretos siguen en el panel de Pages.
# Sin PROPOSALS la función acepta propuestas y no aplica el límite diario ni caché del tablón.
[[kv_namespaces]]
binding = "PROPOSALS"
id = "80ac94ce81e8459fb3882e9fe2a68330"
