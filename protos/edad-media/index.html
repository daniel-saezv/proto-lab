<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Medieval Age</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #141a26;
        color: #f4ead7;
        font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #vista {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #141a26;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        padding:
          calc(8px + env(safe-area-inset-top))
          calc(10px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          calc(10px + env(safe-area-inset-left));
        pointer-events: none;
      }
      h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.03em; }
      p { margin: 0; }
      button {
        font: 600 0.92rem/1.1 system-ui, sans-serif;
        min-height: 44px;
        min-width: 44px;
        border-radius: 12px;
        border: 1px solid #8a7044;
        background: rgba(24, 18, 14, 0.9);
        color: #f4ead7;
        padding: 8px 10px;
        touch-action: none;
      }
      button.hora { border-color: #e6c15a; color: #ffe7a8; }
      button:disabled { opacity: 0.42; }
      button[aria-pressed="true"] { outline: 2px solid #e6c15a; }
      .panel, #esferas, #mandos, #oficios, #caida {
        pointer-events: auto;
      }
      .panel {
        background: rgba(16, 12, 10, 0.78);
        border-radius: 14px;
        padding: 8px 10px;
      }
      #cima p + p { margin-top: 2px; font-size: 0.95rem; }
      #bienes { font: 600 0.82rem/1.2 system-ui, sans-serif; opacity: 0.92; }
      #aviso, #fallo {
        margin: 8px auto 0;
        max-width: 36rem;
        text-align: center;
        background: rgba(16, 12, 10, 0.74);
        border-radius: 12px;
        padding: 8px 12px;
      }
      #fallo { background: rgba(80, 28, 22, 0.8); }
      .barra {
        position: relative;
        height: 22px;
        margin-top: 6px;
        background: #2a2118;
        border-radius: 11px;
        overflow: hidden;
      }
      .barra i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #b64032;
      }
      .barra.mana i { background: #3d78b4; }
      .barra span {
        position: relative;
        z-index: 1;
        display: block;
        padding-left: 8px;
        font: 600 0.75rem/22px system-ui, sans-serif;
      }
      #esferas, #oficios, #listaObra {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      #esferas button, #oficios button, #listaObra button { flex: 1 1 21%; }
      #mandos { display: flex; gap: 6px; margin-top: 8px; }
      #mandos button { flex: 1; }
      #panelObra { margin-top: 8px; }
      #caida {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: min(20rem, calc(100% - 32px));
        text-align: center;
      }
      #caida button { margin-top: 10px; width: 100%; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="vista" aria-label="Campo de batalla medieval"></canvas>
    <div id="hud">
      <div>
        <div id="cima" class="panel">
          <h1>Medieval Age</h1>
          <p id="oficio"></p>
          <p id="guerra"></p>
          <p id="bienes"></p>
        </div>
        <p id="aviso" hidden></p>
        <p id="fallo" hidden></p>
      </div>
      <div>
        <div id="caida" class="panel" hidden>
          <p>Has caído. El castillo sigue en pie.</p>
          <button type="button" id="alzar">Alzarse</button>
        </div>
        <div id="oficios" hidden>
          <button type="button" data-clase="caballero">Caballero</button>
          <button type="button" data-clase="ballestero">Ballestero</button>
          <button type="button" data-clase="fraile">Fraile</button>
          <button type="button" data-clase="astrologo">Astrólogo</button>
        </div>
        <div id="panelObra" class="panel" hidden>
          <p>El castillo</p>
          <div id="listaObra"></div>
        </div>
        <div class="panel">
          <div class="barra"><span id="vidaTexto"></span><i id="vidaBar"></i></div>
          <div class="barra mana"><span id="manaTexto"></span><i id="manaBar"></i></div>
          <div id="esferas"></div>
          <div id="mandos">
            <button type="button" id="castillo" aria-expanded="false">Castillo</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
