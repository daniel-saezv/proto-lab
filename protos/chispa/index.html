<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pozo de bolas</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14182b; color: #f6f1e7; font-family: "Segoe UI", system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: calc(10px + env(safe-area-inset-top)) 16px 8px; }
      #hud p { margin: 0; }
      #game-title { font-weight: 800; letter-spacing: 0.02em; animation: latido 1.1s ease-in-out infinite alternate; }
      #combo { color: #ffd23f; font-weight: 800; }
      #stage { flex: 1; min-height: 0; touch-action: none; outline: none; }
      #stage canvas { display: block; }
      #again { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; background: rgba(10, 12, 24, 0.72); text-align: center; }
      #again[hidden] { display: none; }
      #again p { margin: 0; font-size: 2rem; font-weight: 800; }
      #again button { font: inherit; font-size: 1.1rem; padding: 14px 22px; border: 0; border-radius: 999px; background: #ffb703; color: #1a1203; font-weight: 700; }
      @keyframes latido { from { transform: scale(1); } to { transform: scale(1.07); } }
      @media (prefers-reduced-motion: reduce) { #game-title { animation: none; } }
    </style>
  </head>
  <body>
    <div id="hud">
      <p id="game-title" data-testid="game-title">Pozo de bolas</p>
      <p id="score" data-testid="score">Puntos: 0</p>
      <p id="best" data-testid="best">Mejor: 0</p>
      <p id="combo" data-testid="combo" hidden></p>
    </div>
    <div id="stage" tabindex="0"></div>
    <div id="again" data-testid="game-over" hidden>
      <p>¡Se desbordó!</p>
      <button type="button" id="retry">Otra vez</button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
