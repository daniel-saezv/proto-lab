<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pozo de bolas</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #14182b;
        color: #f6f1e7;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
      #hud {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 4px 12px;
        padding: calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.2;
      }
      #hud p { margin: 0; }
      #game-title { font-size: 1.45rem; font-weight: 800; letter-spacing: 0.02em; animation: latido 1.1s ease-in-out infinite alternate; }
      #next { color: #d7e3ff; }
      #combo-rail {
        grid-column: 1 / -1;
        min-height: calc(1.35rem * 2 + 10px + 8px);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 4px;
        pointer-events: none;
      }
      #combo {
        color: #ffd23f;
        font-weight: 800;
        font-size: 1.35rem;
        visibility: hidden;
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      #combo.is-live {
        visibility: visible;
        opacity: 1;
        transform: scale(1);
        animation: combo-brillo 0.45s ease;
      }
      #fever {
        color: #ff8ac8;
        font-weight: 800;
        font-size: 1.35rem;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      #fever.is-live { visibility: visible; opacity: 1; animation: fever-pulso 0.9s ease-in-out infinite alternate; }
      #combo-meter {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      #combo-meter.is-live { visibility: visible; opacity: 1; }
      #combo-meter span {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ffb703, #ffd23f, #fff6d8);
        transform-origin: left center;
        transform: scaleX(1);
        box-shadow: 0 0 10px rgba(255, 210, 63, 0.55);
      }
      #stage { flex: 1; min-height: 0; touch-action: none; outline: none; }
      #stage canvas { display: block; touch-action: none; }
      #again {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 16px;
        background: rgba(10, 12, 24, 0.72);
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: manipulation;
      }
      #again[hidden] { display: none; }
      #again p { margin: 0; font-size: 2.1rem; font-weight: 800; }
      #again button {
        font: inherit;
        font-size: 1.25rem;
        min-height: 56px;
        padding: 14px 28px;
        border: 0;
        border-radius: 999px;
        background: #ffb703;
        color: #1a1203;
        font-weight: 700;
        touch-action: manipulation;
      }
      body.fever { background: #2a1430; }
      body.fever #hud { background: rgba(255, 77, 141, 0.18); }
      @keyframes latido { from { transform: scale(1); } to { transform: scale(1.07); } }
      @keyframes combo-brillo {
        0% { transform: scale(0.85); filter: brightness(1.4); }
        100% { transform: scale(1); filter: brightness(1); }
      }
      @keyframes fever-pulso { from { filter: brightness(1); } to { filter: brightness(1.35); } }
      @media (prefers-reduced-motion: reduce) {
        #game-title { animation: none; }
        #combo.is-live, #fever.is-live { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <p id="game-title" data-testid="game-title">Pozo de bolas</p>
      <p id="next" data-testid="next">Siguiente</p>
      <p id="score" data-testid="score">Puntos: 0</p>
      <p id="best" data-testid="best">Mejor: 0</p>
      <div id="combo-rail" aria-live="polite">
        <p id="fever" data-testid="fever" aria-hidden="true">¡Fiebre! x2</p>
        <p id="combo" data-testid="combo" aria-hidden="true"></p>
        <div id="combo-meter" data-testid="combo-meter" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="stage" tabindex="0"></div>
    <div id="again" data-testid="game-over" hidden>
      <p>¡Se desbordó!</p>
      <button type="button" id="retry">Otra vez</button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
